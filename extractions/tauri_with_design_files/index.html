<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      {
        try {
          const s = JSON.parse(localStorage.getItem('promptor.state.v1') || 'null')
          const t = s && s.theme
          const sys = matchMedia('(prefers-color-scheme: dark)').matches
          if (t && t !== 'system') {
            document.documentElement.setAttribute('data-theme', t)
            document.querySelector('meta[name="color-scheme"]').content = t === 'dark' ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', t === 'dark' || ((!t || t === 'system') && sys))
        } catch (e) {}
      }
    </script>
    <title>PromptTOR</title>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
