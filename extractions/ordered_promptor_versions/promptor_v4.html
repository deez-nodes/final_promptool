:root{font-family:'Segoe UI',sans-serif;color:#292638;background:#edeaf2;font-size:14px;--purple:#6243a1;--line:#ddd8e6;--muted:#6c657b}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:inherit;border-radius:6px;padding:8px 11px}button:hover{border-color:var(--purple);background:#f3eefc}button:disabled{opacity:.35;cursor:default}button.primary{background:var(--purple);border-color:var(--purple);color:white}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a184dc;outline-offset:2px}input,select,textarea{border:1px solid var(--line);border-radius:6px;background:white;color:inherit;padding:10px;min-width:0}header{min-height:76px;padding:16px 26px;background:#342645;color:#fff;display:flex;align-items:center;gap:18px}header strong{font-size:23px;letter-spacing:-1px}header .tagline{color:#d1c4df}header .actions{margin-left:auto;display:flex;gap:8px}header button{background:#453555;color:white;border-color:#705c82}.workspace{display:grid;grid-template-columns:300px minmax(350px,1fr);min-height:calc(100vh - 76px)}aside{padding:25px 18px;background:#f6f4f9;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;align-self:start;height:calc(100vh - 76px)}h2,h3,p{margin-top:0}h2{font-size:17px;margin-bottom:14px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sidebar-head h2{margin:0}.full{width:100%}.library-list{overflow:auto;padding:2px;margin-top:12px}#library{flex:1;min-height:0}.group{margin-bottom:4px}.group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 4px;font-size:12px;font-weight:600;border-radius:5px}.group summary::-webkit-details-marker{display:none}.group summary::before{content:'▸';color:var(--muted);width:9px}.group[open]>summary::before{content:'▾'}.group summary:hover{background:#ebe6f3}.group .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--muted))}.group .count{margin-left:auto;font-weight:400;color:var(--muted)}.row{display:flex;align-items:center;margin:0 0 3px 16px;background:white;border:1px solid var(--line);border-left:3px solid var(--c,var(--line));border-radius:5px}.row:hover{border-color:var(--purple);border-left-color:var(--c,var(--purple))}.row button{border:0;background:transparent}.row .main{flex:1;min-width:0;text-align:left;padding:5px 9px;display:flex;align-items:baseline;gap:8px}.row .name{flex:0 1 auto;min-width:40%;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .kind{font-size:11px;font-weight:400;color:var(--muted);margin-left:7px}.row .snippet{flex:1 1 0;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .tools{display:none}.row:hover .tools,.row:focus-within .tools{display:flex}.row .tools button{font-size:12px;color:var(--muted);padding:6px 7px}.row button:hover{background:#f3eefc}main{padding:28px 30px;min-width:0}.title-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px}.status{font-size:12px;color:var(--muted);max-width:170px;text-align:right}.prompt-title{flex:1;font-size:20px;font-weight:600;padding:8px 0;border:0;border-radius:0;background:transparent}.section{background:white;border:1px solid var(--line);border-left:4px solid #aa91d0;border-radius:6px;margin-bottom:6px;overflow:hidden}.section.off{opacity:.6}.section-top{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#faf8fc;border-bottom:1px solid #eeeaf3}.section.closed .section-top{border-bottom:0;background:white}.section-top .toggle{width:22px;color:var(--ink,#292638)}.summary{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;cursor:pointer;white-space:nowrap;overflow:hidden;padding:4px 2px}.summary strong{font-size:14px}.summary .kind{font-size:12px;color:var(--muted)}.summary .snippet{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.section-top .from{font-size:12px;color:var(--muted);white-space:nowrap}.section-top input[type=text]{font-weight:600;border:0;background:transparent;padding:4px;width:100%;flex:1}.section-top input::-webkit-calendar-picker-indicator{display:none!important}.section-top input::placeholder{font-weight:400;color:#a59fb3}.section-top button{padding:3px 7px;border:0;background:transparent;color:var(--muted)}.section textarea{display:block;width:100%;border:0;resize:none;overflow:hidden;field-sizing:content;min-height:3.2em;border-radius:0;line-height:1.65;padding:10px 16px 12px}.section-top .save-piece{font-size:12px;color:var(--purple);white-space:nowrap}.empty{padding:35px 18px;text-align:center;border:1px dashed #b8acc9;border-radius:8px;color:var(--muted);line-height:1.7}.empty.small{padding:9px;font-size:12px}main>*{max-width:900px}.actions-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}.actions-bar select{font-size:12px;padding:8px 6px}.actions-bar .spacer{flex:1}#stats{margin:0}.exact{margin-top:14px}.exact summary{cursor:pointer;font-size:12px;color:var(--muted)}#output{display:block;width:100%;min-height:120px;max-height:50vh;field-sizing:content;resize:vertical;background:#fcfbfe;border-color:#d6cee1;font:13px/1.7 Consolas,monospace;padding:14px;margin-top:8px}dialog{border:1px solid var(--line);border-radius:12px;padding:26px;width:min(550px,calc(100% - 30px));box-shadow:0 20px 80px #34264540}dialog::backdrop{background:#23193266}dialog label{display:block;margin-bottom:14px}dialog label input,dialog label textarea,dialog label select{display:block;width:100%;margin-top:6px}dialog textarea{min-height:180px;resize:vertical}dialog .actions{display:flex;justify-content:flex-end;gap:8px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-5 <body>
<header><strong>PrompTOR</strong><span class="tagline">Good prompts are worth reusing.</span><div class="actions"><button id="download">Download prompt</button><button id="importBtn">Import backup</button><button id="backupBtn">Export backup</button></div></header>
<div class="workspace">
<aside aria-label="Prompt library"><div class="sidebar-head"><h2>Your library</h2><button id="createPiece" title="Create a reusable piece">+ New piece</button></div><input class="full" id="search" type="search" placeholder="Search — Enter adds the top piece" aria-label="Search library"><div id="library" class="library-list"></div><p class="source-note">Click a piece to add it. Editing a prompt never changes the library piece.</p></aside>
<main><div class="title-row"><input id="title" class="prompt-title" aria-label="Prompt title" placeholder="Give your prompt a name"><span id="status" class="status" role="status">Draft saved locally</span></div><div id="sections"></div><datalist id="typeNames"></datalist><div class="actions-bar"><button class="primary" id="copy" title="Ctrl+Enter">Copy prompt</button><button id="addBlank">+ New section</button><select id="format" aria-label="Copy as"><option value="text">Plain text</option><option value="markdown">Markdown</option><option value="xml">XML</option></select><span class="muted" id="stats"></span><span class="spacer"></span><button id="savePrompt">Save prompt</button><button id="newPrompt">New prompt</button><button id="undo" disabled>Undo</button></div><details class="exact" id="exact"><summary>Show exactly what gets copied</summary><textarea id="output" readonly aria-label="Combined prompt"></textarea></details><p class="source-note">Ctrl+Enter copies from anywhere. Stored in this browser — export a backup to keep it safe.</p></main>
</div>
<dialog id="pieceDialog"><form id="pieceForm"><h2 id="dialogTitle">Save a reusable piece</h2><label>Name<input id="pieceName" required maxlength="150" placeholder="e.g. Direct, practical feedback"></label><label>Type<select id="pieceType"><option>Role</option><option>Persona</option><option>Task</option><option>Context</option><option>Instructions</option><option>Constraints</option><option>Output format</option><option>Example</option><option>Custom</option></select></label><label>Prompt text<textarea id="pieceText" required placeholder="Write or paste a piece you want to reuse…"></textarea></label><div class="actions"><button type="button" id="cancelPiece">Cancel</button><button class="primary" type="submit">Save piece</button></div></form></dialog>
<input id="importFile" class="import" type="file" accept="application/json,.json"><div id="toast" role="status"></div>

<script>
'use strict';
const $=id=>document.getElementById(id), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), clone=x=>JSON.parse(JSON.stringify(x));
const types=['Role','Persona','Task','Context','Instructions','Constraints','Output format','Example','Custom'];
const starterData=[['Role','Thoughtful editor','You are a thoughtful editor. Preserve the author’s meaning and voice while improving clarity, structure, and precision.'],['Role','Practical developer','You are an experienced software developer. Work within the existing architecture, favor simple solutions, and verify the behavior you change.'],['Persona','Patient teacher','Explain unfamiliar concepts in plain language. Build from what the learner already knows, use a concrete example, and check for understanding.'],['Instructions','Ask only what matters','If missing information would materially change the answer, ask a focused question. Otherwise, state any necessary assumptions and proceed.'],['Constraints','Be clear about uncertainty','Distinguish established facts from assumptions. If you cannot verify a claim, say so. Do not invent sources or details.'],['Output format','Recommendation with tradeoffs','Start with your recommendation. Explain the main tradeoffs, then give concrete next steps. Keep the response concise.'],['Instructions','Stay within scope','Focus on the requested task. Preserve existing behavior unless a change is necessary. Flag unrelated issues separately.'],['Output format','Actionable review','List findings in priority order. For each finding, describe the issue, its impact, and a specific improvement.']];
const starters=starterData.map(([type,name,text])=>({id:uid(),type,name,text,source:'Starter'}));
const key='promptor-workbench-v1';let state={version:1,pieces:starters,prompts:[],draft:{title:'Untitled prompt',sections:[]},format:'text'},editing=null,history=[];
function normalizeSection(s){if(!s||typeof s!=='object')return null;const text=s.text??s.content??'';if(typeof text!=='string')return null;let raw=String(s.type||s.key||s.label||'Custom').toLowerCase().replaceAll('_',' ');const type=types.find(t=>t.toLowerCase()===raw)||(raw.includes('role')?'Role':'Custom');return {id:uid(),type,label:String(s.label||type),text,included:s.included!==false};}
function importDocuments(docs){let added=0;for(const d of docs){if(!d||!Array.isArray(d.sections))continue;const sections=d.sections.map(normalizeSection).filter(Boolean);if(!sections.length)continue;const title=String(d.title||'Imported prompt');if(!state.prompts.some(p=>p.title===title&&JSON.stringify(p.sections.map(s=>s.text))===JSON.stringify(sections.map(s=>s.text)))){state.prompts.push({id:uid(),title,sections});added++;}for(const s of sections){if(s.text.trim()&&!state.pieces.some(p=>p.text===s.text)){state.pieces.push({id:uid(),type:s.type,name:title+' / '+s.label,text:s.text,source:'Past prompt'});}}}return added;}
let loadIssue='';try{const saved=localStorage.getItem(key);if(saved){const parsed=JSON.parse(saved);if(!parsed.draft||!Array.isArray(parsed.draft.sections)||!Array.isArray(parsed.pieces)||!Array.isArray(parsed.prompts))throw Error();state=parsed;}else{importDocuments(JSON.parse($('past-prompts').textContent));}}catch(e){loadIssue='Could not load browser storage. Import a backup if needed.';}
function blank(){return {id:uid(),type:'Custom',label:'',text:'',included:true};}
function isScratch(){const s=state.draft.sections;return s.length===1&&!s[0].text.trim()&&!s[0].label;}
if(!state.draft.sections.length)state.draft.sections.push(blank());
function save(){try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='Draft saved locally';}catch(e){$('status').textContent='Storage unavailable — export a backup';}}
function toast(t){$('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',3500);}
function checkpoint(){history.push(clone(state));if(history.length>30)history.shift();$('undo').disabled=false;}
function button(text,fn,title){const b=document.createElement('button');b.textContent=text;b.type='button';if(title){b.title=title;b.setAttribute('aria-label',title);}b.onclick=fn;return b;}
function textEl(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
function xmlEscape(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function output(){return state.draft.sections.filter(s=>s.included&&s.text.trim()).map(s=>{const label=s.label.trim();if(state.format==='xml'){let tag=(label||s.type).toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'')||'section';if(!/^[a-z_]/.test(tag))tag='section_'+tag;return '<'+tag+'>\n'+xmlEscape(s.text.trim())+'\n</'+tag+'>';}return (label?(state.format==='markdown'?'## ':'')+label+'\n':'')+s.text.trim();}).join('\n\n');}
function updateOutput(){const out=output();$('output').value=out;$('stats').textContent=(out.trim()?out.trim().split(/\s+/).length:0)+' words · '+out.length+' characters';$('copy').disabled=$('download').disabled=!out;save();}
const autoGrow=CSS.supports('field-sizing','content')?()=>{}:a=>{a.style.height='auto';a.style.height=a.scrollHeight+'px';};
function insertText(a,t){if(!document.execCommand(t?'insertText':'delete',false,t)){a.setRangeText(t,a.selectionStart,a.selectionEnd,'end');a.dispatchEvent(new Event('input'));}}
function listEnter(e,a){if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.metaKey||e.altKey||a.selectionStart!==a.selectionEnd)return;const pos=a.selectionStart,start=a.value.lastIndexOf('\n',pos-1)+1,line=a.value.slice(start,pos),m=line.match(/^(\s*)([-*•]|(\d+)([.)]))\s+/);if(!m)return;e.preventDefault();if(m[0].length===line.length){a.setSelectionRange(start,pos);insertText(a,'');}else insertText(a,'\n'+m[1]+(m[3]?(+m[3]+1)+m[4]:m[2])+' ');}
function focusEnd(){const a=[...$('sections').querySelectorAll('textarea')].pop();if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length);}}
const colors={Role:'#c99a06',Persona:'#c2478f',Task:'#d9682a',Context:'#3a82c4',Instructions:'#7c58c9',Constraints:'#cf4a4a','Output format':'#2f9a76',Example:'#6a8f3a',Custom:'#9a93a8'},typeOf=p=>types.includes(p.type)?p.type:'Custom';
function renderSections(){const host=$('sections');host.replaceChildren();$('title').value=state.draft.title;if(!state.draft.sections.length){host.append(textEl('div','Click a piece in your library, or add a new section below.','empty'));}state.draft.sections.forEach((s,i)=>{const open=s.open!==false,nm=s.label.trim()||s.type,box=textEl('article','','section'+(s.included?'':' off')+(open?'':' closed')),head=textEl('div','','section-top');box.style.borderLeftColor=colors[typeOf(s)];const toggle=button(open?'▾':'▸',()=>{s.open=!open;renderSections();$('sections').children[i].querySelector(s.open?'textarea':'.toggle').focus();},(open?'Collapse ':'Expand ')+nm);toggle.className='toggle';head.append(toggle);if(open){const label=document.createElement('input');label.type='text';label.value=s.label;label.placeholder='Section name (optional)';label.setAttribute('aria-label','Section name');label.setAttribute('list','typeNames');label.onfocus=checkpoint;label.oninput=()=>{s.label=label.value;const t=types.find(t=>t.toLowerCase()===label.value.trim().toLowerCase());if(t){s.type=t;box.style.borderLeftColor=colors[t];}updateOutput();};head.append(label);if(s.name)head.append(textEl('span',s.name,'from'));}else{const sum=textEl('div','','summary');sum.onclick=()=>toggle.click();sum.append(textEl('strong',s.name||nm));if(s.name)sum.append(textEl('span','• '+nm,'kind'));sum.append(textEl('span',s.text.replace(/\s+/g,' '),'snippet'));head.append(sum);}if(!s.included)head.append(button('Include',()=>{checkpoint();s.included=true;renderSections();},'Include '+nm+' in the prompt'));for(const [symbol,delta,title] of [['↑',-1,'Move section up'],['↓',1,'Move section down']]){const b=button(symbol,()=>{checkpoint();const arr=state.draft.sections;[arr[i],arr[i+delta]]=[arr[i+delta],arr[i]];renderSections();},title);b.disabled=i+delta<0||i+delta>=state.draft.sections.length;head.append(b);}if(open){const keep=button('Save as piece',()=>openPiece(s));keep.className='save-piece';head.append(keep);}head.append(button('×',()=>{checkpoint();state.draft.sections.splice(i,1);renderSections();toast('Section removed. Undo brings it back.');},'Remove '+nm));box.append(head);host.append(box);if(!open)return;const area=document.createElement('textarea');area.value=s.text;area.placeholder=s.type==='Custom'?'Write here. Enter is a new line, "- " starts a list, Ctrl+Enter copies.':'Write your '+s.type.toLowerCase()+' here…';area.setAttribute('aria-label',nm+' text');area.onfocus=checkpoint;area.oninput=()=>{s.text=area.value;autoGrow(area);updateOutput();};area.onkeydown=e=>{listEnter(e,area);if(e.altKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const list=[...host.querySelectorAll('textarea')];list[list.indexOf(area)+(e.key==='ArrowDown'?1:-1)]?.focus();}};box.append(area);autoGrow(area);});updateOutput();}
function addSection(type,text='',label=type,name='',open=true){checkpoint();if(isScratch())state.draft.sections=[];state.draft.sections.push({id:uid(),type,label,name,text,included:true,open});renderSections();const box=$('sections').lastElementChild;box.querySelector(open?'textarea':'.toggle').focus();box.scrollIntoView({block:'nearest',behavior:'auto'});}
function row(name,meta,preview,label,fn,tools){const r=textEl('div','','row'),b=button('',fn),n=textEl('div',name,'name'),t=textEl('div','','tools');if(meta)n.append(textEl('span',meta,'kind'));b.className='main';b.setAttribute('aria-label',label);b.title=preview;b.append(n,textEl('div',preview.replace(/\s+/g,' '),'snippet'));t.append(...tools);r.append(b,t);return r;}
function matches(p,q){return [p.name,p.title,p.text,p.source,...(p.sections||[]).map(s=>s.text)].join(' ').toLowerCase().includes(q);}
function visiblePieces(){const q=$('search').value.toLowerCase();return state.pieces.filter(p=>matches(p,q)).sort((a,b)=>types.indexOf(typeOf(a))-types.indexOf(typeOf(b)));}
function addPiece(p){addSection(typeOf(p),p.text,typeOf(p),p.name,false);}
const closed=new Set();
function group(title,count,key,color){const d=document.createElement('details'),s=document.createElement('summary'),searching=!!$('search').value.trim();d.className='group';d.open=searching||!closed.has(key);if(color){d.style.setProperty('--c',color);s.append(textEl('span','','dot'));}d.ontoggle=()=>{if(!searching)d.open?closed.delete(key):closed.add(key);};s.append(title,textEl('span',String(count),'count'));d.append(s);return d;}
function del(kind,item,name){return button('×',()=>{checkpoint();state[kind]=state[kind].filter(x=>x.id!==item.id);save();renderLibrary();toast(name+' deleted. Undo brings it back.');},'Delete '+name);}
function renderLibrary(){const q=$('search').value.toLowerCase(),host=$('library');host.replaceChildren();const prompts=state.prompts.filter(p=>matches(p,q)),pieces=visiblePieces();if(prompts.length||!q){const g=group('Saved prompts',prompts.length,'prompts');for(const p of prompts){const title=p.title||'Untitled prompt',n=p.sections.length;g.append(row(title,n===1?'1 section':n+' sections',p.sections.map(s=>s.text).join(' '),'Open '+title,()=>{checkpoint();state.draft=clone(p);renderSections();toast('Prompt opened. Undo returns to your previous draft.');},[del('prompts',p,title)]));}if(!prompts.length)g.append(textEl('div','Prompts you save appear here.','empty small'));host.append(g);}for(const t of types){const items=pieces.filter(p=>typeOf(p)===t);if(!items.length)continue;const g=group(t,items.length,t,colors[t]);for(const p of items)g.append(row(p.name,'',p.text,'Add '+p.name,()=>addPiece(p),[button('Edit',()=>openPiece(p,p.id),'Edit '+p.name),del('pieces',p,p.name)]));host.append(g);}if(q&&!pieces.length&&!prompts.length)host.append(textEl('div','No matches. Try another search.','empty'));}
function openPiece(s=null,id=null){editing=id;$('dialogTitle').textContent=id?'Edit library piece':'Save a reusable piece';$('pieceName').value=s?.name||s?.label||'';$('pieceType').value=s?.type||'Instructions';$('pieceText').value=s?.text||'';$('pieceDialog').showModal();}
$('pieceForm').onsubmit=e=>{e.preventDefault();const name=$('pieceName').value.trim(),text=$('pieceText').value.trim();if(!name||!text){toast('Add a name and some prompt text.');return;}checkpoint();const p={id:editing||uid(),name,type:$('pieceType').value,text,source:'Saved by you'};if(editing)state.pieces[state.pieces.findIndex(x=>x.id===editing)]=p;else state.pieces.unshift(p);save();renderLibrary();$('pieceDialog').close();toast('Piece saved to your library');};
$('cancelPiece').onclick=()=>$('pieceDialog').close();$('createPiece').onclick=()=>openPiece();$('title').onfocus=checkpoint;$('title').oninput=()=>{state.draft.title=$('title').value;save();};$('search').oninput=renderLibrary;
$('search').onkeydown=e=>{if(e.key!=='Enter'||!$('search').value.trim())return;const p=visiblePieces()[0];if(!p)return;e.preventDefault();$('search').value='';renderLibrary();addPiece(p);};
for(const t of types)$('typeNames').append(new Option(t,t));$('addBlank').onclick=()=>addSection('Custom','','');
$('format').value=state.format;$('format').onchange=()=>{state.format=$('format').value;updateOutput();};
$('savePrompt').onclick=()=>{if(!state.draft.sections.some(s=>s.text.trim())){toast('Add some prompt text first.');return;}checkpoint();const draft=clone(state.draft);draft.title=draft.title.trim()||'Untitled prompt';draft.id=draft.id||uid();const i=state.prompts.findIndex(p=>p.id===draft.id);if(i>=0)state.prompts[i]=draft;else state.prompts.unshift(draft);state.draft=clone(draft);save();renderLibrary();toast('Prompt saved');};
$('newPrompt').onclick=()=>{checkpoint();if(state.draft.sections.some(s=>s.text.trim())){const p=clone(state.draft);p.id=p.id||uid();const i=state.prompts.findIndex(x=>x.id===p.id);if(i>=0)state.prompts[i]=p;else state.prompts.unshift(p);}state.draft={title:'Untitled prompt',sections:[blank()]};renderSections();renderLibrary();focusEnd();toast('New prompt started. Previous work is in Saved prompts.');};
const strip=x=>JSON.stringify(x,(k,v)=>k==='open'?undefined:v);
$('undo').onclick=()=>{const now=strip(state);let prev=null;while(history.length){const h=history.pop();if(strip(h)!==now){prev=h;break;}}$('undo').disabled=!history.length;if(!prev)return;state=prev;$('format').value=state.format;renderSections();renderLibrary();toast('Undone');};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!$('pieceDialog').open&&!$('copy').disabled){e.preventDefault();$('copy').click();}});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output());toast('Prompt copied');}catch(e){$('exact').open=true;$('output').focus();$('output').select();try{if(!document.execCommand('copy'))throw Error();toast('Prompt copied');}catch(e){toast('Press Ctrl+C to copy the selected prompt.');}}};
$('download').onclick=()=>download((state.draft.title||'prompt').replace(/[^a-z0-9_-]/gi,'_')+'.'+({text:'txt',markdown:'md',xml:'xml'}[state.format]),output(),'text/plain');
$('backupBtn').onclick=()=>download('promptor-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.documents)&&!Array.isArray(data.prompts)&&!Array.isArray(data.pieces))throw Error('This file does not contain a recognized prompt library.');const previous=clone(state);checkpoint();try{let count=importDocuments(data.documents||data.prompts||[]);for(const p of data.pieces||[]){if(typeof p.text==='string'&&p.text.trim()&&!state.pieces.some(x=>x.text===p.text)){state.pieces.push({id:uid(),name:String(p.name||'Imported piece'),type:types.includes(p.type)?p.type:'Custom',text:p.text,source:'Imported'});count++;}}if(data.draft?.sections?.some(s=>(s.text||s.content||'').trim()))count+=importDocuments([{...data.draft,title:(data.draft.title||'Untitled')+' (backup draft)'}]);save();renderLibrary();toast(count+' items imported. Your current draft is unchanged.');}catch(err){state=previous;throw err;}}catch(err){toast(err.message||'Could not read this backup.');}e.target.value='';};
renderSections();renderLibrary();focusEnd();if(loadIssue)toast(loadIssue);
</script>
</body>
