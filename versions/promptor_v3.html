<body>
<header class="topbar"><span class="brand">PrompTOR</span><span class="edition">Your writing, in sections</span><button id="libraryToggle" class="quiet" aria-label="Toggle library">Library</button><span class="spacer"></span><span id="saveStatus" class="save-status" role="status">Saved in this browser</span><label><span>Copy as</span><select id="format" aria-label="Copy format"><option value="xml">XML</option><option value="markdown">Markdown</option><option value="text">Plain text</option></select></label><button id="copy" class="primary" title="Ctrl+Enter">Copy prompt</button></header>
<div class="layout" id="layout">
<nav class="library" aria-label="Reusable material"><div class="library-title"><h2>Your material</h2><button id="newPiece" class="quiet" aria-label="New reusable piece">+</button></div><input id="search" type="search" placeholder="Find a piece or prompt" aria-label="Search material"><div id="library" class="library-scroll"></div><div class="library-footer"><button id="importExisting">Import existing material</button><button id="backup">Export backup</button><button id="restore">Import backup</button></div></nav>
<main class="work"><div class="draft-scroll" id="draftScroll"><div class="draft"><div id="storageAlert" class="storage-alert" hidden></div><div class="document-top"><input id="title" class="document-title" placeholder="Untitled prompt" aria-label="Prompt title"></div><div class="document-meta"><span id="counts">One section. Start writing.</span><span class="spacer"></span><button id="reading" class="quiet" aria-pressed="false">Reading view</button><button id="sourceToggle" class="quiet" aria-expanded="false">Reference / reply</button></div><div class="tools"><select id="startingPoint" aria-label="Starting point"></select><button id="addStarting">Add sections</button><button id="saveStarting">Save starting point</button><button id="saveSelection">Save selection</button><button id="attachDocument">Add document</button></div><div id="sections"></div><button id="addSection" class="add-section">+ New section</button><div class="bottom-tools"><button id="savePrompt">Save prompt</button><button id="newPrompt">New prompt</button><button id="nextTurn" title="Save this turn and keep only sections marked Keep for next turn">Next turn</button><span class="spacer"></span><button id="undo" disabled>Undo</button><span>Enter writes a new line</span></div><details class="exact" id="exact"><summary>Inspect the copied text</summary><textarea id="output" readonly aria-label="Assembled prompt"></textarea></details></div></div>
<section id="reference" class="reference" aria-label="Reference and reply" hidden><div class="reference-head"><h2>Reference / reply</h2><button id="closeSource" aria-label="Close reference">×</button></div><input id="sourceName" aria-label="Reference name" placeholder="Name this source (optional)"><textarea id="sourceText" aria-label="Reference text" placeholder="Paste an agent response or relevant text here. Select any passage to bring it into your draft."></textarea><p class="hint">Add the selection to…</p><div id="quoteButtons" class="quote-buttons"></div><div class="file-actions"><button id="loadSource">Open text file</button><button id="clearSource">Clear source</button></div><p id="quoteStatus" class="notice" role="status">Collect as many passages as you need. Nothing is sent.</p></section>
</main></div>
<dialog id="saveDialog"><form id="saveForm"><h2 id="saveHeading">Save piece</h2><label>Name<input id="saveName" required maxlength="160"></label><label id="pieceBodyLabel">Text<textarea id="pieceBody"></textarea></label><div class="dialog-actions"><button id="cancelSave" type="button">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
<dialog id="pullDialog"><h2 id="pullHeading">Pull sections</h2><div id="pullSections"></div><div class="dialog-actions"><button id="closePull">Done</button></div></dialog>
<input id="backupFile" class="file-input" type="file" accept=".json,application/json"><input id="documentFile" class="file-input" type="file"><input id="sourceFile" class="file-input" type="file"><datalist id="sectionNames"><option>Request</option><option>Persona</option><option>Context</option><option>Constraints</option><option>Instructions</option><option>Agreements</option><option>Corrections</option><option>Questions</option><option>Proposed edits</option><option>Expected output</option><option>Settled decisions</option></datalist><div id="toast" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),copyData=x=>JSON.parse(JSON.stringify(x)),id=()=>crypto.randomUUID(),KEY='promptor-editor-v1',OLD_KEY='promptor-workbench-v1';
const makeSection=(name='',text='')=>({id:id(),name,text,open:true,included:true,keep:false,points:[]});

let state={version:1,format:'xml',draft:makeDraft(),pieces:[],prompts:[],starts:[],history:[]},undoStack=[],active=null,sourceRange=null,saveIntent=null,reading=false,storageBlocked=false,unreadable='';
function cleanPoint(p){return {id:id(),name:String(p.name||''),text:String(p.text||''),quote:typeof p.quote==='string'?p.quote:'',sourceName:String(p.sourceName||p.sourceTitle||''),sourceText:typeof p.sourceText==='string'?p.sourceText:undefined,start:Number.isInteger(p.start)?p.start:undefined,end:Number.isInteger(p.end)?p.end:undefined};}
function cleanSection(s){return {...makeSection(String(s.name&&s.label===undefined?s.name:s.label||s.type||''),String(s.text??s.content??'')),open:s.open!==false,included:s.included!==false,keep:!!s.keep,points:(Array.isArray(s.points)?s.points:Array.isArray(s.items)?s.items:[]).map(cleanPoint)};}
function cleanDraft(d){return {...makeDraft(),title:String(d.title||''),sections:Array.isArray(d.sections)&&d.sections.length?d.sections.map(cleanSection):[makeSection()],source:typeof d.source==='string'?{name:'',text:d.source,open:!!d.source}:{name:String(d.source?.name||''),text:String(d.source?.text||''),open:!!d.source?.open}};}
function validDraft(d){return d&&typeof d.title==='string'&&Array.isArray(d.sections)&&d.sections.every(s=>s&&typeof s.name==='string'&&typeof s.text==='string'&&Array.isArray(s.points)&&s.points.every(p=>p&&typeof p.text==='string'&&typeof p.quote==='string'));}
try{const raw=localStorage.getItem(KEY);if(raw){unreadable=raw;const value=JSON.parse(raw);if(value.version!==1||!validDraft(value.draft)||!Array.isArray(value.pieces)||!value.pieces.every(p=>p&&typeof p.text==='string')||!Array.isArray(value.prompts)||!value.prompts.every(validDraft)||!Array.isArray(value.starts)||!value.starts.every(a=>a&&Array.isArray(a.sections))||!Array.isArray(value.history)||!value.history.every(validDraft))throw Error('Unrecognized saved data');state={...value,format:['xml','markdown','text'].includes(value.format)?value.format:'xml',draft:{...cleanDraft(value.draft),id:value.draft.id||id()}};unreadable='';}}catch(e){storageBlocked=true;}
const filled=s=>!!(s.text.trim()||s.points.some(p=>p.text.trim()||p.quote)),meaningful=d=>d.sections.some(filled),el=(tag,text='',cls='')=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;};
function button(text,action,label){const b=el('button',text);b.type='button';b.onclick=action;if(label){b.setAttribute('aria-label',label);b.title=label;}return b;}
function notice(text){$('toast').textContent=text;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').textContent='',3500);}
function checkpoint(){const snapshot=JSON.stringify(state);if(undoStack.at(-1)!==snapshot)undoStack.push(snapshot);if(undoStack.length>50)undoStack.shift();$('undo').disabled=!undoStack.length;}
function persist(){if(storageBlocked){$('saveStatus').textContent='Not saved — export your work';$('storageAlert').hidden=false;$('storageAlert').replaceChildren(el('span','Existing browser data could not be read. It has not been overwritten. Export this draft before closing. '),button('Download unreadable data',()=>download('promptor-recovery.txt',unreadable||'Browser storage unavailable.')));return;}try{localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='Saved in this browser';$('storageAlert').hidden=true;}catch(e){$('saveStatus').textContent='Not saved — export your work';$('storageAlert').hidden=false;$('storageAlert').textContent='Browser storage is unavailable or full. Export a backup before closing.';}}
const tagName=(name,fallback='section')=>{let t=name.trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||fallback;return /^[a-z_]/.test(t)?t:'section_'+t;};
const literal=text=>/[<&]|\]\]>/.test(text)?'<![CDATA['+text.replaceAll(']]>',']]]]><![CDATA[>')+']]>':text;
const wrap=(tag,text)=>'<'+tag+'>\n'+text+'\n</'+tag+'>';
function pointTag(s,p,index){const stems={agreements:'agreement',corrections:'correction',questions:'question','proposed edits':'edit',asides:'aside'};return p.name?tagName(p.name):tagName(stems[s.name.toLowerCase()]||s.name||'point')+'_'+String(index+1).padStart(2,'0');}
function bodyXML(s){return [s.text?literal(s.text):'',...s.points.filter(p=>p.text.trim()||p.quote).map((p,i)=>wrap(pointTag(s,p,i),[p.quote?wrap('quote',literal(p.quote)):'',p.sourceName?wrap('source',literal(p.sourceName)):'',p.text?(p.quote?wrap('comment',literal(p.text)):literal(p.text)):''].filter(Boolean).join('\n')))].filter(Boolean).join('\n');}
function demote(text,by=1){let fence=null;return text.split('\n').map(line=>{const m=line.match(/^\s{0,3}(`{3,}|~{3,})/);if(m){if(!fence)fence={char:m[1][0],length:m[1].length};else if(m[1][0]===fence.char&&m[1].length>=fence.length&&/^\s{0,3}(`+|~+)\s*$/.test(line))fence=null;return line;}return !fence?line.replace(/^(#{1,6})\s/,(_,h)=>'#'.repeat(Math.min(6,h.length+by))+' '):line;}).join('\n');}
function assemble(){const sections=state.draft.sections.filter(s=>s.included&&filled(s));if(!sections.length)return '';if(state.format==='xml')return wrap('prompt',sections.map(s=>wrap(tagName(s.name),bodyXML(s))).join('\n\n'));return sections.map(s=>[s.name?(state.format==='markdown'?'# ':'')+s.name:'',state.format==='markdown'?demote(s.text):s.text,...s.points.filter(p=>p.text.trim()||p.quote).map(p=>[p.name?(state.format==='markdown'?'## ':'')+p.name:'',p.quote?p.quote.split('\n').map(l=>'> '+l).join('\n'):'',p.text].filter(Boolean).join('\n'))].filter(Boolean).join('\n')).join('\n\n');}
function update(){const output=assemble();$('output').value=output;$('copy').disabled=!output;const n=state.draft.sections.length;const words=output.trim()?output.trim().split(/\s+/).length:0;$('counts').textContent=n+(n===1?' section':' sections')+' · '+words+' words';persist();}
function color(name){const n=name.toLowerCase();if(/agree|settled|persona|role/.test(n))return '#237660';if(/correct|constraint/.test(n))return '#ac4c41';if(/question|context|response|reference/.test(n))return '#286caa';if(/edit|request|task|output/.test(n))return '#94651b';return '#637887';}
function grow(a){a.style.height='auto';a.style.height=Math.max(a.scrollHeight,38)+'px';}
function target(){const s=state.draft.sections.find(s=>s.id===active?.section);if(!s)return null;const p=active.point?s.points.find(p=>p.id===active.point):null;return active.point&&!p?null:{s,body:p||s,p};}
function captureSelection(a,s,p){active={section:s.id,point:p?.id||null,start:a.selectionStart,end:a.selectionEnd};}
function makeEditor(s,p){const obj=p||s;const area=el('textarea');area.value=obj.text;area.setAttribute('aria-label',p?(s.name||'Section')+' point text':(s.name||'Untitled section')+' text');if(!p&&s.points.length)area.style.minHeight='30px';area.placeholder=p?(p.quote?'Add your comment, or leave this quote on its own.':'Write this point. Alt+Enter adds another.'):s.points.length?'Section introduction (optional)':'Write here. Paragraphs, lists, code — no tags to type.';area.dataset.section=s.id;if(p)area.dataset.point=p.id;

function mergeMaterial(data){const previous=copyData(state),undoLength=undoStack.length;try{for(const key of ['pieces','prompts','documents','starts','arrangements','history'])if(data?.[key]!==undefined&&!Array.isArray(data[key]))throw Error('Invalid '+key+' in backup.');return mergeMaterialUnsafe(data);}catch(error){state=previous;undoStack.length=undoLength;renderAll();throw error;}}
